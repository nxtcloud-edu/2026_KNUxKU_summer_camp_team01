[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "voyagent-search-agent"
version = "0.1.0"
description = "LangGraph search orchestration for Voyagent"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "langgraph==1.2.11",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voyagent_search = ["schemas/*.json"]
