[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voyagent-supervisor"
version = "0.1.0"
description = "Voyagent supervisor that orchestrates search, plan, and verification agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "langgraph",
  "pydantic>=2",
  "uvicorn[standard]"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
