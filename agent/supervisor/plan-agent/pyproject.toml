[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voyagent-plan-agent"
version = "0.1.0"
description = "LangGraph plan agent that turns SearchToPlanInput into PlanToVerificationInput"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "google-genai",
  "httpx",
  "langgraph",
  "pydantic>=2",
  "uvicorn[standard]"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
